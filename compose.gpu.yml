# GPU-enabled deployment with NVIDIA passthrough
# Enables hardware-accelerated WebGL rendering via Vulkan
# Requirements: NVIDIA GPU + nvidia-container-toolkit
#
# Usage: docker compose -f compose.gpu.yml up

services:
  browser-pool:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18080:18080" # Dashboard/nginx HTTP (all services proxied here)
      - "18443:18443" # Dashboard/nginx HTTPS
      - "8000:8000"   # REST API (direct)
      - "3099:3099"   # MCP server (direct)
      - "15900:5900"  # VNC server (host 15900 -> container 5900)
      - "6080:6080"   # noVNC web interface (direct)
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MAX_BROWSERS=${MAX_BROWSERS:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_BASE_URL=http://localhost:18080
      - SCREENSHOTS_DIR=${SCREENSHOTS_DIR:-/app/screenshots}
      - SCREENSHOTS_TTL_SECONDS=${SCREENSHOTS_TTL_SECONDS:-3600}
      - SCREENSHOTS_MAX_BYTES=${SCREENSHOTS_MAX_BYTES:-268435456}
      - SCREENSHOTS_MIN_FREE_BYTES=${SCREENSHOTS_MIN_FREE_BYTES:-67108864}
      - NGINX_HTTPS_PORT=18443
      # AI vision (optional - set base URL, key, and model to enable)
      - VISION_API_BASE_URL=${VISION_API_BASE_URL:-}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_MODEL=${VISION_MODEL:-}
      - VISION_STREAM_DEFAULT=${VISION_STREAM_DEFAULT:-}
    volumes:
      - browser-profiles:/app/browser-profiles
      - screenshots:/app/screenshots
      - downloads:/app/downloads
      - session-state:/app/state
    tmpfs:
      - /tmp:noexec,nosuid,size=500m
      - /dev/shm:rw,nosuid,nodev,exec,size=4g
    shm_size: 4gb
    init: true
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    runtime: nvidia
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '1.0'
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, display, video, compute]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  browser-profiles:
  screenshots:
  downloads:
  session-state:
