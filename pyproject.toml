[project]
name = "airbrowser-mcp"
version = "1.15.0"
description = "AI Remote Browser - Undetectable Chrome runtime for AI agents with REST API and MCP"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "flask-restx>=1.2.0",
    "flask-sock>=0.7.0",
    "websocket-client>=1.6.0",
    "seleniumbase>=4.47.4",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dateutil>=2.8.2",
    "typing-extensions>=4.7.1",
    "lazy-imports>=1,<2",
    "urllib3>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "prometheus-client>=0.17.0",
    "fastmcp>=0.3.0",
    "openai>=1.0.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "pproxy>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-rerunfailures>=12.0",
    "ruff>=0.8.0",
    "pre-commit>=3.5.0",
]

[tool.ruff]
# Target Python 3.10+
target-version = "py310"

# Line length to match common standards
line-length = 120

# Exclude generated and third-party code
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "generated-clients",
    "third_party",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable these rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "E722",   # bare except (common in cleanup code)
    "E402",   # module level import not at top of file (sometimes necessary)
    "B008",   # function call in default argument (common in Flask)
    "B017",   # pytest.raises(Exception) - acceptable in validation tests
    "B904",   # raise without from (too noisy)
    "SIM105", # contextlib.suppress (try-except-pass is often clearer)
    "SIM108", # ternary operator (readability preference)
    "SIM115", # context manager for open() (not always applicable)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["airbrowser"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix-style line endings
line-ending = "lf"
